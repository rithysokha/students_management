name: Student transcript 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: maven
    - name: Copy secret.properties to project
      run: cp /home/thy/secret.properties /home/thy/actions-runner/_work/students_management/students_management/src/main/resources
    - name: Build with Maven
      run: mvn clean package

    - name: Build Docker image
      run: docker build -t student:latest .

    - name: Deploy Docker container
      run: |
        docker stop student || true
        docker rm student || true
        docker run -d -p 8080:8080 --name studentApi student:latest
