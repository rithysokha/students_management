name: Merge check 

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: maven
    - name: Stop and remove old container
      run: |
        docker stop studentApi || true
        docker rm studentApi || true
        
    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Build Docker image
      run: docker build -t student:latest .

    - name: Deploy Docker container
      run: docker run -d -p 8080:8080 --name studentApi student:latest
